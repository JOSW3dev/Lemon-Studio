name: Build Lemon Studio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p os-app --locked

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: lemonstudio-windows
          path: target/release/lemonstudio.exe
